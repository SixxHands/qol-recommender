name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and build
        run: ./gradlew test build --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/qolrecommender-*.jar | grep -v -- '-sources' | head -n 1)
          gh release create "${GITHUB_REF_NAME}" "$JAR" \
            --title "${GITHUB_REF_NAME}" \
            --notes "NeoForge 1.21.1 release ${GITHUB_REF_NAME}."
